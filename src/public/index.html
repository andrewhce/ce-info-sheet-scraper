<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>School Info Sheet</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">School Info Sheet<span>website checker</span></a>
  <nav class="tabs" id="nav">
    <a href="#/start" data-view="start">Start here</a>
    <a href="#/" data-view="schools">Schools</a>
    <a href="#/review" data-view="review" title="The answers the dashboard is least sure about">To check</a>
    <a href="#/run" data-view="run" title="Read the schools’ websites">Check websites</a>
    <a href="#/sources" data-view="sources" title="Answers from Ravenna, Niche and review sites, from pages you saved by hand">Ravenna &amp; reviews</a>
    <a href="#/ask" data-view="ask" title="Ask the AI assistant a question about the schools">Ask</a>
    <a href="#/accuracy" data-view="accuracy" title="How often the answers are right">Accuracy</a>
    <a href="#/help" data-view="help" title="What the words and colours mean">Help</a>
  </nav>
  <a class="jobpill" id="jobpill" href="#/run" hidden></a>
  <div class="who" id="who" hidden></div>
  <div class="viewopts" id="viewopts" role="group" aria-label="Text size and colours"></div>
</header>
<main id="app"><p class="loading">Loading&hellip;</p></main>
<footer class="appfoot" id="appfoot">
  <a href="#/script" class="muted">Technical details (for IT staff)</a>
  <span class="spacer"></span>
  <span id="dataloc" class="muted" hidden></span>
  <button type="button" class="btn link small" id="quitbtn" hidden>Turn off dashboard</button>
</footer>
<div class="tasks" id="tasks" aria-live="polite"></div>
<script src="/app.js"></script>
</body>
</html>
